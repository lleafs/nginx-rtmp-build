worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Logs en rutas Unix
    access_log  /home/eabar/nginx-rtmp-build/logs/access.log;
    error_log   /home/eabar/nginx-rtmp-build/logs/error.log debug;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       8080;
        server_name  localhost;

        location / {
            root   /home/eabar/nginx-rtmp-build/html;
            index  index.html index.htm;
        }
    }
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        application live {
            live on;
            record off;
        }
    }
}
